name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # --omit=dev, because what ships is what matters: a dev-only advisory cannot
      # reach a user of this server. Gated at `high` rather than `moderate` only
      # because one moderate is outstanding upstream — hono's CORS ReDoS, which the
      # SDK pulls in and this server does not reach (it sets its own CORS headers).
      # hono@4.12.34 fixes it and clears the 7-day minimum-release-age policy on
      # 2026-08-10; tighten this to `--audit-level=moderate` once the override lands,
      # so a new moderate cannot arrive unnoticed.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: node --test test/*.test.mjs

      # Proves the packaged server actually starts and speaks MCP without any
      # ReAI credentials: it must fail with a clear configuration error rather
      # than a stack trace.
      - name: Startup error is actionable without a token
        run: |
          set +e
          output=$(node dist/index.js 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "::error::server should exit non-zero when REAI_USER_API_TOKEN is unset"
            exit 1
          fi
          echo "$output" | grep -q "REAI_USER_API_TOKEN" || {
            echo "::error::startup error must name the missing variable"
            exit 1
          }

  package:
    name: Verify published package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pack and inspect
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          for required in dist/index.js dist/http.js spec/index.json spec/reai-openapi.json LICENSE README.md; do
            grep -qE "[[:space:]]${required}$" pack.log || {
              echo "::error::$required is missing from the published package"
              exit 1
            }
          done
